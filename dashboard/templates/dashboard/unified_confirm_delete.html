{% extends 'dashboard/dashboard_base.html' %}
{% load static %}
{% load dashboard_extras %}

{% block dashboard_content %}
<div class="row mt-5" data-aos="fade-down">
    <div class="col-md-8 col-lg-6 mx-auto text-center">
        <div class="card shadow border-0 rounded-4 p-5 bg-white">
            <div class="mb-4">
                <div class="bg-danger bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center"
                    style="width: 80px; height: 80px;">
                    <i data-feather="alert-triangle" class="text-danger" style="width: 40px; height: 40px;"></i>
                </div>
            </div>

            <h3 class="font-weight-bold text-dark mb-3">Delete Confirmation</h3>
            <p class="text-muted mb-4 pb-2" style="font-size: 1.1rem;">
                Are you absolutely sure you want to permanently delete
                <strong class="text-dark bg-light px-2 py-1 rounded">{{ object }}</strong>?
                <br><br>
                <small class="text-danger">This action cannot be undone.</small>
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ next_url|default:'javascript:history.back()' }}"
                        class="btn btn-outline-secondary px-4 font-weight-bold bg-light">Cancel & Go Back</a>
                    <button type="submit" class="btn btn-danger px-5 shadow font-weight-bold">Yes, Delete {{ object|verbose_name }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
