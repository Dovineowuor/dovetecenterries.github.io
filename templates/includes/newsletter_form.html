{% load static %}
<div class="newsletter-signup bg-white p-4 rounded-4 shadow-sm border">
    <h3 class="h5 font-weight-bold text-dark mb-3">Newsletter</h3>
    <p class="text-muted small mb-4">Stay updated with our latest news and offers. No spam, we promise!</p>
    <form method="POST" action="{% url 'subscribe' %}" class="d-flex flex-column gap-2">
        {% csrf_token %}
        <div class="form-group mb-2">
            <input type="email" name="email" class="form-controlpx-4" placeholder="Enter your email" required>
        </div>
        <button type="submit" class="btn btn-primary font-weight-bold shadow-sm">Subscribe Now</button>
    </form>
</div>
