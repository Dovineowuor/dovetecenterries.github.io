<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f4f6f9; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #f4f6f9; padding-bottom: 40px; }
        .main { background-color: #ffffff; margin: 0 auto; width: 100%; max-width: 600px; border-spacing: 0; color: #4b5563; }
        .header { background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%); padding: 30px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .content { padding: 40px 30px; font-size: 16px; }
        .footer { background-color: #fdfdfd; padding: 30px; text-align: center; border-top: 1px solid #f3f4f6; }
        .footer p { margin: 0; font-size: 12px; color: #9ca3af; }
        .footer a { color: #0d47a1; text-decoration: none; font-weight: 600; }
        .button { background-color: #1a237e; color: #ffffff !important; padding: 12px 25px; border-radius: 5px; text-decoration: none; display: inline-block; font-weight: 700; margin-top: 20px; }
        img { max-width: 100%; height: auto; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <table class="main">
            <tr>
                <td class="header">
                    <h1>Dovetec Digest</h1>
                </td>
            </tr>
            <tr>
                <td class="content">
                    {% block email_content %}{% endblock %}
                </td>
            </tr>
            <tr>
                <td class="footer">
                    <p>&copy; 2026 Dovetec Enterprises. Innovation & Excellence.</p>
                    <p style="margin-top: 10px;">
                        <a href="{{ unsubscribe_link }}">Unsubscribe</a> | <a href="{{ preferences_link }}">Manage Preferences</a>
                    </p>
                    <p style="margin-top: 20px;">123 Innovation Drive, Nairobi, Kenya</p>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
