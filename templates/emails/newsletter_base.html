<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <style>
        :root { color-scheme: light dark; supported-color-schemes: light dark; }
        html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
        }
        table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; max-width: 100%; }
        a { text-decoration: none; }
        .dt-shell { width: 100%; background-color: #f5f5f7; }
        .dt-card { width: 100%; max-width: 640px; background-color: #ffffff; border-radius: 22px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.05); }
        .dt-hero { padding: 44px 40px 32px; }
        .dt-section { padding: 32px 40px; }
        .dt-display { font-size: 32px; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; color: #1d1d1f; margin: 0 0 10px; }
        .dt-body { font-size: 17px; line-height: 1.5; letter-spacing: -.01em; color: #1d1d1f; margin: 0; }
        .dt-muted { font-size: 15px; line-height: 1.45; color: #6e6e73; }
        .dt-fine { font-size: 12px; line-height: 1.4; color: #86868b; }
        .dt-btn { display: inline-block; font-size: 17px; line-height: 1; font-weight: 500; letter-spacing: -.01em; padding: 13px 26px; border-radius: 980px; color: #fff !important; text-align: center; }
        .dt-divider { height: 1px; background-color: #e5e5ea; }
        .dt-footer { padding: 32px 40px; text-align: center; background-color: #fbfbfd; }
        .dt-footer a { color: #6e6e73; text-decoration: underline; }
        .dt-otp {
            font-size: 34px; font-weight: 700; letter-spacing: .18em; text-align: center;
            background-color: #f5f5f7; border-radius: 16px; padding: 18px; margin: 20px 0; color: #1d1d1f;
        }
        @media (prefers-color-scheme: dark) {
            body { background-color: #000 !important; }
            .dt-card { background-color: #1d1d1f !important; box-shadow: none !important; }
            .dt-display, .dt-body, .dt-otp { color: #f5f5f7 !important; }
            .dt-muted, .dt-fine { color: #98989d !important; }
            .dt-divider { background-color: #3a3a3c !important; }
            .dt-footer, .dt-otp { background-color: #2c2c2e !important; }
        }
        @media only screen and (max-width: 620px) {
            .dt-card { border-radius: 0 !important; }
            .dt-hero { padding: 32px 24px 24px !important; }
            .dt-section { padding: 24px !important; }
            .dt-footer { padding: 24px !important; }
            .dt-display { font-size: 26px !important; }
            .dt-btn { display: block !important; width: 100% !important; }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#f5f5f7;">

<div style="display:none; max-height:0; max-width:0; overflow:hidden; opacity:0; mso-hide:all;">
    {% block preheader %}{% endblock %}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
</div>

<div class="dt-shell" style="padding:24px 12px;">
    <table role="presentation" class="dt-card" align="center" width="100%">
        <tr>
            <td style="padding:0;">

                <table role="presentation" width="100%">
                    <tr>
                        <td class="dt-hero">
                            <h1 class="dt-display">{% block heading %}{% endblock %}</h1>
                            <p class="dt-muted" style="margin:0;">{% block subheading %}{% endblock %}</p>
                        </td>
                    </tr>
                </table>

                <div class="dt-divider"></div>

                <table role="presentation" width="100%">
                    <tr>
                        <td class="dt-section">
                            {% block email_content %}{% endblock %}
                        </td>
                    </tr>
                </table>

                <div class="dt-divider"></div>

                <table role="presentation" width="100%">
                    <tr>
                        <td class="dt-footer" style="background-color:#fbfbfd; text-align:center;">
                            <p class="dt-fine" style="margin:0 0 8px;">
                                <a href="{{ unsubscribe_link|default:'#' }}">Unsubscribe</a>
                                &nbsp;&middot;&nbsp;
                                <a href="{{ site_url|default:'#' }}">Visit website</a>
                            </p>
                            <p class="dt-fine" style="margin:0;">&copy; {{ year }} Dovetec Enterprises. All rights reserved.</p>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>
</div>

</body>
</html>
