{% load static %}

{% if ads %}
<div class="ad-carousel-wrapper mb-5">
    <div id="adCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            {% for ad in ads %}
            <div class="carousel-item {% if forloop.first %}active{% endif %}" data-bs-interval="5000">
                <a href="{{ ad.url }}" target="_blank" class="text-decoration-none">
                    <div class="ad-banner shadow-sm rounded-3 overflow-hidden position-relative" style="height: 120px; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);">
                        <div class="row g-0 h-100 align-items-center">
                            <div class="col-3 h-100 overflow-hidden d-flex">
                                <img src="{{ ad.main_image.url }}" alt="{{ ad.title }}" class="img-fluid w-100" style="object-fit: cover; min-height: 120px; align-self: stretch;">
                            </div>
                            <div class="col-9">
                                <div class="px-4">
                                    <div class="d-flex align-items-center mb-1">
                                        <span class="badge bg-primary me-2" style="font-size: 0.6rem; letter-spacing: 0.5px;">SPONSORED</span>
                                        <h5 class="h6 mb-0 text-dark fw-bold">{{ ad.title }}</h5>
                                    </div>
                                    <p class="text-muted small mb-0 line-clamp-2">{{ ad.description }}</p>
                                </div>
                            </div>
                        </div>
                        <!-- Decorative element -->
                        <div class="position-absolute top-0 end-0 p-2">
                            <i class="fas fa-external-link-alt text-muted opacity-25" style="font-size: 0.8rem;"></i>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
        
        {% if ads|length > 1 %}
        <button class="carousel-control-prev" type="button" data-bs-target="#adCarousel" data-bs-slide="prev" style="width: 5%; filter: invert(1);">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#adCarousel" data-bs-slide="next" style="width: 5%; filter: invert(1);">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
        {% endif %}
    </div>
</div>

<style>
    .ad-banner {
        transition: transform 0.2s ease-in-out;
        border: 1px solid rgba(0,0,0,0.05);
    }
    .ad-banner:hover {
        transform: scale(1.005);
        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%) !important;
    }
    .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;  
        overflow: hidden;
        line-clamp: 2;
    }
    #adCarousel .carousel-control-prev,
    #adCarousel .carousel-control-next {
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    #adCarousel:hover .carousel-control-prev,
    #adCarousel:hover .carousel-control-next {
        opacity: 0.5;
    }
</style>
{% endif %}
